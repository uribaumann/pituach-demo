<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pituach Admin Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@300;400;500;600&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed sidebar on the right (RTL) + a scrolling work area of panels and tables. Sea-blue on cream, the project's own line. */
:root{
  --bg:#EEF2F8;--side:#FAF9F6;--panel:#FFFFFF;--ink:#2B2A27;--mut:#5F6570;--line:#DFE4EC;--soft:#E6ECF5;
  --accent:#3F5A85;--accent-ink:#FFFFFF;--sky:#C9D6EA;--hover:#F3F6FB;
  --ok:#2F6B52;--ok-bg:#E3F1EA;--warn:#8A5A12;--warn-bg:#FBF0DC;--bad:#A23A3A;--bad-bg:#F8E5E5;--info-bg:#E4EBF6;
  --shadow:0 1px 2px #2b2a270d,0 6px 24px #3f5a8510;
  --serif:'Frank Ruhl Libre',Georgia,serif;--sans:'Heebo',Arial,sans-serif;--lat:'Cormorant Garamond',Georgia,serif;
  --fs:16px;--r:10px;--logo:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181D;--side:#1B1F25;--panel:#20252C;--ink:#ECEEF2;--mut:#A7AEBA;--line:#323944;--soft:#2A313B;
  --accent:#9DB6DC;--accent-ink:#14181E;--sky:#3A4C68;--hover:#262C35;
  --ok:#8FD0B1;--ok-bg:#1E3A2E;--warn:#E8C27E;--warn-bg:#3D3020;--bad:#F0A3A3;--bad-bg:#432627;--info-bg:#28354A;--logo:invert(1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181D;--side:#1B1F25;--panel:#20252C;--ink:#ECEEF2;--mut:#A7AEBA;--line:#323944;--soft:#2A313B;
  --accent:#9DB6DC;--accent-ink:#14181E;--sky:#3A4C68;--hover:#262C35;
  --ok:#8FD0B1;--ok-bg:#1E3A2E;--warn:#E8C27E;--warn-bg:#3D3020;--bad:#F0A3A3;--bad-bg:#432627;--info-bg:#28354A;--logo:invert(1);color-scheme:dark}
:root[data-contrast="high"]{--mut:var(--ink);--line:var(--mut)}
:root[data-size="l"]{--fs:17px}:root[data-size="xl"]{--fs:19px}
*{box-sizing:border-box}
[hidden]{display:none!important}
.li>svg{width:18px;height:18px;color:var(--mut);flex:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
h1{font-family:var(--serif);font-size:1.9em;line-height:1.2}
h2{font-family:var(--serif);font-size:1.3em}
h3{font-size:1em;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:-60px;right:16px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.logo{filter:var(--logo)}
.num{font-variant-numeric:tabular-nums}
.lat{font-family:var(--lat);letter-spacing:.06em}
.mut{color:var(--mut)}.small{font-size:.86em}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--side)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.login-card .brand{display:flex;align-items:center;justify-content:space-between;gap:16px;direction:ltr}
.login-card .brand img{height:30px}
.login-card .brand .ofer{height:34px}
.login-art{position:relative;background:#2B2A27 center/cover;min-height:360px}
.login-art::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 45%,#14181ecc)}
.login-art .cap{position:absolute;bottom:40px;right:44px;left:44px;z-index:1;color:#fff}
.login-art .cap .lat{font-size:15px;letter-spacing:.32em;opacity:.9}
.login-art .cap h2{font-size:2.1em;margin-top:6px;color:#fff}
.notice{background:var(--info-bg);border-radius:8px;padding:12px 14px;font-size:.88em}
.notice b{font-weight:600}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:.92em}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{min-height:200px;order:-1}.login-art .cap{bottom:20px;right:20px;left:20px}.login-art .cap h2{font-size:1.5em}}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.88em;font-weight:500}
.field .hint{font-size:.8em;color:var(--mut)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=search],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:0}
input[aria-invalid=true]{border-color:var(--bad)}
.pw{position:relative}.pw input{padding-left:84px}
.pw button{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--accent);padding:6px 8px;font-size:.86em}
.check{display:flex;align-items:center;gap:10px;font-size:.92em}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:.88em}
.btn.wide{width:100%;min-height:48px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--mut)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;padding:22px 14px 16px}
.side .brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:4px;direction:ltr;align-items:flex-end}
.side .brand img{height:26px}
.side .brand span{font-size:.78em;color:var(--mut);direction:rtl}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.72em;letter-spacing:.06em;color:var(--mut);padding:16px 12px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:1.02em}
.nav a svg{width:19px;height:19px;color:var(--mut);flex:none}
.nav a:hover{background:var(--hover)}
.nav a[aria-current=page]{background:var(--soft);font-weight:500}
.nav a[aria-current=page] svg{color:var(--accent)}
.nav .badge{margin-inline-start:auto}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:.76em;display:inline-grid;place-items:center;font-weight:600}
.side-logout{display:none!important}
.side .foot{margin-top:auto;padding:16px 10px 0;display:flex;flex-direction:column;gap:8px}
.side .foot img{height:26px;align-self:flex-end}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;border-bottom:1px solid var(--line)}
.top .search{flex:1;max-width:440px;position:relative}
.top .search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.top .search input{padding-right:40px;background:var(--panel)}
.sres{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-height:360px;overflow:auto;z-index:20}
.sres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.sres a:hover,.sres a:focus{background:var(--hover)}
.me{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.av{width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--ink);display:grid;place-items:center;font-weight:600;flex:none}
.me .who{line-height:1.25;font-size:.9em}
.menu-btn{display:none}
.content>*{min-width:0;max-width:100%}
.content{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph .eyebrow{display:none;font-size:.74em;letter-spacing:.14em;color:var(--accent);font-weight:500;margin-bottom:4px;direction:ltr;text-align:right}
.ph p{color:var(--mut);margin-top:6px;max-width:68ch}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 0 0 auto;width:280px;z-index:40;transform:translateX(100%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .side.open{transform:none;box-shadow:-20px 0 60px #0003}
  .menu-btn{display:inline-grid}
  .top{padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .content{padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .me .who{display:none}
  .top{gap:8px}.top .search{max-width:none}#logoutBtn{display:none}.side-logout{display:inline-flex!important}
}
.scrim{position:fixed;inset:0;background:#0005;z-index:39}

/* ---------- panels, tiles, tables ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.panel>.ph2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.msgcols{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media (max-width:1100px){.cols,.cols.even,.cols.msgcols{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:4px;text-align:right;color:var(--ink);text-decoration:none}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-size:.82em;color:var(--mut)}
.tile .v{font-family:var(--serif);font-size:1.6em;line-height:1.15}
.tile .s{font-size:.82em;color:var(--mut)}
.tbl-wrap{position:relative;overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:.93em}
th{text-align:right;font-weight:500;color:var(--mut);font-size:.84em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hover)}
td .t{font-weight:500}
td.act{white-space:nowrap;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--accent)}
.chip.plain::before{display:none}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none}
.li .ic svg{width:19px;height:19px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--mut);white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tabs .badge{margin-inline-start:6px;height:20px;min-width:20px;font-size:.72em}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:150px;min-height:40px}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:.9em;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(-18px)}
.switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- upload ---------- */
.drop{border:2px dashed var(--sky);border-radius:var(--r);padding:26px;display:flex;align-items:center;gap:18px;background:color-mix(in srgb,var(--soft) 50%,var(--panel));transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--info-bg)}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--accent);flex:none}
.drop .ic svg{width:24px;height:24px}
.fileic{width:38px;height:46px;border-radius:5px;background:var(--soft);display:grid;place-items:center;font-size:.66em;font-weight:600;color:var(--accent);flex:none;letter-spacing:.04em}
.fileic.img{background-size:cover;background-position:center;color:transparent}
.qlist{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow:auto}
.qlist .q{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}

/* ---------- resident ---------- */
.res-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.res-head .plan{width:150px;height:104px;border-radius:10px;border:1px solid var(--line);background:#fff center/contain no-repeat;flex:none}
.res-head .apt{font-family:var(--lat);font-size:1.25em;letter-spacing:.08em;direction:ltr;text-align:right}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin-top:8px}
.facts div{font-size:.86em;color:var(--mut)}.facts b{display:block;color:var(--ink);font-weight:500;font-size:1.06em}
.thread{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:6px 2px}
.bub{max-width:72%;padding:10px 14px;border-radius:14px;background:var(--soft);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub .tm{font-size:.74em;opacity:.75;margin-top:4px}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.gi .im{aspect-ratio:4/3;background:var(--soft) center/cover;position:relative;max-width:100%}
.gi .im .pos{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:2px 10px;font-size:.76em;font-weight:600}
.gi .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.gi input[type=text]{min-height:36px;padding:6px 10px;font-size:.9em}
.ms{display:flex;flex-direction:column}
.ms .m{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ms .m:last-child{border:0}
.ms .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ms .m.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms .m.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--info-bg)}
.ms .dot svg{width:12px;height:12px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex;gap:3px}
.bar i{flex:1;background:var(--line)}.bar i.on{background:var(--accent)}

/* ---------- dialog, toast, a11y ---------- */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px #0004}
dialog.wide{width:min(980px,calc(100vw - 32px))}
dialog::backdrop{background:#14181e80}
dialog form,dialog .dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.db{padding:20px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.df{display:flex;gap:10px;justify-content:flex-start;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.pv{background:var(--soft);border-radius:10px;min-height:300px;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;max-height:62vh}
.pv canvas,.pv img{max-width:100%;height:auto;background:#fff;box-shadow:var(--shadow);border-radius:4px}
.pv .pages{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.a11y-btn{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;z-index:60;box-shadow:0 6px 20px #3f5a8555}
.a11y-btn svg{width:26px;height:26px}

  if(ST.reminders.some(x=>x.res===r.id&&x.pay===p.id&&x.status!=='skipped'))return;
  ST.reminders.push({id:uid('rm'),res:r.id,pay:p.id,status:'pending',created:today(),by:'מערכת',text:'',sendOn:addDays(p.due,-ST.remLead)});n++}));
 const t=today();ST.reminders.filter(x=>x.status==='sched'&&x.sendOn<=t).forEach(sendRem);if(n)save();return n}
function sendRem(x){const r=resOf(x.res),p=r&&payRows(r).find(y=>y.id===x.pay);if(!p)return;x.status='sent';x.sentAt=today();
 (ST.threads[x.res]||(ST.threads[x.res]=[])).push({me:true,t:x.text||remText(r,p),at:new Date().toISOString()})}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'plain:'+s}}
let AUTH=LS.get(AUTH_KEY)||{email:DEMO.email,hash:null,fails:0,lockUntil:0};
const saveAuth=()=>LS.set(AUTH_KEY,AUTH);
const IDLE_MIN=30;let lastAct=Date.now();
function session(){const s=SS.get('pa-session')||LS.get('pa-remember');return s&&s.exp>Date.now()?s:null}
function startSession(remember){const s={email:AUTH.email,exp:Date.now()+(remember?7*864e5:12*36e5)};SS.set('pa-session',s);if(remember)LS.set('pa-remember',s)}
function logout(msg){SS.del('pa-session');AS='uri';try{sessionStorage.removeItem('pa-as')}catch(e){}try{localStorage.removeItem('pa-remember')}catch(e){}location.hash='';renderLogin(msg)}
['click','keydown','pointermove'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));

VIEWS.defects=()=>pageHead('DEFECTS','ליקויים ובדק','פעיל באפליקציה משלב המסירה. הדייר מדווח, הקבלן מטפל, ואנחנו עוקבים עד שהליקוי נסגר. כל שינוי סטטוס מגיע לדייר כהתראה.',`<button class="btn" data-act="addTk">${I('plus')}פתיחת ליקוי</button>`)+

function a11yPop(){const p=$('#a11yPop');p.innerHTML=`<h2 style="font-size:1.1em">נגישות</h2>

 <label class="check"><span class="switch"><input type="checkbox" id="a-con" ${A11Y.contrast?'checked':''}><i></i></span>ניגודיות גבוהה</label>
 <label class="check"><span class="switch"><input type="checkbox" id="a-lnk" ${A11Y.links?'checked':''}><i></i></span>הדגשת קישורים</label>
 <button class="btn sm" id="a-rst">איפוס הגדרות</button><p class="small mut">ניווט מלא במקלדת: Tab למעבר, Enter לבחירה, Esc לסגירה.</p>`;
 $$('[data-fs]',p).forEach(b=>b.onclick=()=>{A11Y.size=b.dataset.fs;applyA11y();a11yPop();$(`[data-fs="${A11Y.size}"]`).focus()});
 $('#a-con').onchange=e=>{A11Y.contrast=e.target.checked;applyA11y()};$('#a-lnk').onchange=e=>{A11Y.links=e.target.checked;applyA11y()};$('#a-rst').onclick=()=>{A11Y.size='';A11Y.contrast=false;A11Y.links=false;applyA11y();a11yPop()}}
$('#a11yBtn').onclick=()=>{const p=$('#a11yPop'),o=p.hidden;p.hidden=!o;$('#a11yBtn').setAttribute('aria-expanded',o);if(o){a11yPop();$('button',p).focus()}};
